spring.application.name=banking-v1


spring.datasource.url= ${DB_URL:jdbc:postgresql://localhost:5432/core_banking_ledger}
spring.datasource.driver-class-name= org.postgresql.Driver
spring.datasource.username= ${DB_USERNAME:akt}
spring.datasource.password= ${DB_PASSWORD:akt}

spring.jpa.hibernate.ddl-auto= validate
spring.jpa.show-sql= ${JPA_SHOW_SQL:false}
spring.jpa.open-in-view= false
spring.jpa.properties.hibernate.format_sql= true

spring.flyway.enabled= true

jwt.secret-key= ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbi1taW5pbXVtLTMyLWJ5dGVz}
jwt.secret-key-expiration= 10m
jwt.issuer= core-banking-ledger
jwt.audience= bank-client

# ACTUATOR & OBSERVABILITY CONFIGURATION
management.endpoints.web.exposure.include= health, info, metrics, prometheus
management.endpoint.health.show-details= WHEN_AUTHORIZED
management.endpoint.health.probes.enabled= true

# Prometheus Common Tags
management.metrics.tags.application=${spring.application.name}


app.seed-demo-users= ${SEED_DEMO_USERS:true}